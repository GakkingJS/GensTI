services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD_FILE: /run/secrets/gensti_app_password
      OUTBOX_FERNET_KEY_FILE: /run/secrets/outbox_fernet_key

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}

      FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL en .env}
    secrets:
      - gensti_app_password
      - outbox_fernet_key

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "outbox_worker.py"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PASSWORD_FILE: /run/secrets/gensti_app_password
      OUTBOX_FERNET_KEY_FILE: /run/secrets/outbox_fernet_key

      BREVO_API_KEY: ${BREVO_API_KEY:?Falta BREVO_API_KEY en .env}
      EMAIL_FROM: ${EMAIL_FROM:?Falta EMAIL_FROM en .env}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GENSTI}
    secrets:
      - gensti_app_password
      - outbox_fernet_key

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

  migrate:
    build:
      context: ./backend
    profiles:
      - tools
    working_dir: /app
    volumes:
      - ./backend:/app
    entrypoint: ["alembic"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_PASSWORD_FILE: /run/secrets/gensti_migration_password
    secrets:
      - gensti_migration_password

secrets:
  gensti_app_password:
    file: ./secrets/gensti_app_password.txt

  gensti_migration_password:
    file: ./secrets/gensti_migration_password.txt

  outbox_fernet_key:
    file: ./secrets/outbox_fernet_key

volumes:
  postgres_data: